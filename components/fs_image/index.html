<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeterHome</title>
    <link rel="icon" href="data:image/ico;base64,aWNv">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .home-wrap {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #4a93f6;
            text-align: center;
        }
        .home-content {
            width: 80%;
            max-width: 500px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 2px 0 12px #fff;
            padding: 20px;
            position: relative;
        }
        .btn-wrap button {
            width: 100%;
            line-height: 40px;
            background: #66aafe;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s linear;
        }
        .btn-wrap button:hover {
            opacity: 0.8;
        }
        .wifi-list-wrap {
            position: absolute;
            left: 0;
            top: 50px;
            background: #fff;
            padding: 6px 0;
            box-shadow: 0 0 6px #ccc;
            z-index: 2;
            border-radius: 6px;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            display: none;
        }
        .wifi-list-wrap ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .wifi-list-wrap li {
            padding: 10px;
            cursor: pointer;
        }
        .wifi-list-wrap li:hover {
            background: rgba(102, 170, 254, 0.5);
        }
        .content img {
            display: block;
            margin: 0 auto 20px;
            max-width: 100px;
        }
        .device-wrap {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .device-item input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div class="home-wrap">
        <div class="home-content">
            <div class="content">
                <div class="device-wrap">
                    <div class="device-item">
                        <input id="ssid" maxlength="32" type="text" placeholder="SSID" />
                        <span id="show-wifi-list" class="icon" onclick="toggleWifiList()">📶</span>
                        <div id="wifi-list" class="wifi-list-wrap">
                            <ul id="wifi-options"></ul>
                        </div>
                    </div>
                    <div class="device-item">
                        <input id="password" maxlength="64" type="password" placeholder="PASSWORD" />
                    </div>
                    <div class="device-item">
                        <input id="message" disabled type="text" readonly placeholder="Message" />
                    </div>
                </div>
                <div class="btn-wrap">
                    <button id="start-connect" onclick="postData()">Connect</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const Ajax = {
            get(url, callback) {
                fetch(url)
                    .then(response => response.text())
                    .then(callback)
                    .catch(console.error);
            },
            post(url, data, callback) {
                fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                })
                .then(response => response.text())
                .then(callback)
                .catch(console.error);
            }
        };

        function postData() {
            const ssid = document.getElementById("ssid").value;
            const password = document.getElementById("password").value;
            if (!ssid) return alert("Please enter SSID");
            if (ssid.length > 32) return alert("SSID too long");
            if (password.length > 64) return alert("Password too long");
            
            Ajax.post("/setstainfo", { ssid, password }, response => {
                console.log(JSON.parse(response));
            });
        }

        function toggleWifiList() {
            const wifiList = document.getElementById("wifi-list");
            wifiList.style.display = wifiList.style.display === "block" ? "none" : "block";
            fetchWifiList();
        }

        function fetchWifiList() {
            Ajax.get("/getaprecord", response => {
                const data = JSON.parse(response);
                const wifiOptions = document.getElementById("wifi-options");
                wifiOptions.innerHTML = data.aplist?.length ?
                    data.aplist.map(network => `<li onclick="selectWifi('${network.ssid}')">${network.ssid}</li>`).join('') :
                    "<li>No networks found</li>";
            });
        }

        function selectWifi(ssid) {
            document.getElementById("ssid").value = ssid;
            document.getElementById("wifi-list").style.display = "none";
        }
    </script>
</body>
</html>
