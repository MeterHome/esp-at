<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { margin: 0; padding: 0; outline: 0 !important; box-sizing: border-box; }
        .d-flex { display: flex; }
        .d-j-c { justify-content: center; }
        .d-a-i { align-items: center; }
        .home-wrap { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background: #4a93f6; text-align: center; }
        .home-content { width: 80%; max-width: 500px; background: #fff; border-radius: 20px; box-shadow: 2px 0 12px #fff; padding: 20px; position: relative; }
        .btn-wrap button { width: 100%; line-height: 40px; background: #66aafe; color: #fff; border: 0; border-radius: 6px; cursor: pointer; transition: all .2s linear; }
        .btn-wrap button:hover { opacity: .8; }
        .wifi-list-wrap {
            position: absolute;
            left: 0;
            top: 50px;
            background: #fff;
            padding: 6px 0;
            box-shadow: 0 0 6px #ccc;
            z-index: 2;
            border-radius: 6px;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            display: none;
        }
        .wifi-list-wrap ul { list-style: none; padding: 0; margin: 0; }
        .wifi-list-wrap li { padding: 10px; cursor: pointer; }
        .wifi-list-wrap li:hover { background: rgba(102, 170, 254, 0.5); }
        .content img {
            display: block;
            margin: 0 auto 20px;
            max-width: 100px;
        }
        .device-wrap { display: flex; flex-direction: column; gap: 15px; }
        .device-item input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; }
    </style>
</head>

                <div class="device-wrap">
                    <div id="ssid-wrap" class="device-item">
                        <div class="ssid-input">
                            <input id="ssid" maxlength="32" type="text" placeholder="SSID" readonly />
                            <span id="show-wifi-list" class="icon" onclick="toggleWifiList()">📶</span>
                        </div>
                        <div id="wifi-list" class="wifi-list-wrap">
                            <ul id="wifi-options"></ul>
                        </div>
                    </div>
                    <div class="device-item"><input id="password" maxlength="64" type="password" placeholder="PASSWORD" /></div>
                    <div class="device-item"><input id="message" disabled type="text" readonly placeholder="Message" /></div>
                </div>
                <div class="btn-wrap"><button id="start-connect" onclick="postData()" class="btn">Connect</button></div>
            </div>
        </div>
    </div>
    <script>
        var Ajax = {
            get: function(url, callback) {
                var xhr = new XMLHttpRequest();
                xhr.open("GET", url, true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState == 4 && (xhr.status == 200 || xhr.status == 304)) {
                        callback(xhr.responseText);
                    }
                };
                xhr.send();
            },
            post: function(url, data, callback, isJson = false) {
                var xhr = new XMLHttpRequest();
                xhr.open("POST", url, true);
                xhr.setRequestHeader("Content-Type", isJson ? "application/json" : "application/x-www-form-urlencoded;charset=UTF-8");
                xhr.onreadystatechange = function() {
                    if (xhr.readyState == 4 && (xhr.status == 200 || xhr.status == 304)) {
                        callback(xhr.responseText);
                    }
                };
                xhr.send(isJson ? JSON.stringify(data) : data);
            }
        };
        
        function postData() {
            let ssid = document.getElementById("ssid").value;
            let password = document.getElementById("password").value;
            if (!ssid) {
                alert("Please enter SSID");
                return;
            }
            if (ssid.length > 32) {
                alert("SSID too long");
                return;
            }
            if (password.length > 64) {
                alert("Password too long");
                return;
            }
            let data = { ssid: ssid, password: password };
            Ajax.post("/setstainfo", data, function(response) {
                console.log("Response received:", response);
            }, true);
        }
        function toggleWifiList() {
            const wifiList = document.getElementById("wifi-list");
            if (wifiList.style.display === "none" || wifiList.style.display === "") {
                fetchWifiList();
                wifiList.style.display = "block";
            } else {
                wifiList.style.display = "none";
            }
        }

        function fetchWifiList() {
            const wifiOptions = document.getElementById("wifi-options");
            wifiOptions.innerHTML = "<li>Loading...</li>";
            fetch("/getaprecord")
                .then(response => response.json())
                .then(data => {
                    wifiOptions.innerHTML = "";
                    if (data.aplist && data.aplist.length > 0) {
                        data.aplist.forEach(network => {
                            const li = document.createElement("li");
                            li.textContent = network.ssid;
                            li.onclick = () => selectWifi(network.ssid);
                            wifiOptions.appendChild(li);
                        });
                    } else {
                        wifiOptions.innerHTML = "<li>No networks found</li>";
                    }
                })
                .catch(error => {
                    wifiOptions.innerHTML = "<li>Error loading networks</li>";
                    console.error("Error fetching Wi-Fi list:", error);
                });
        }

        function selectWifi(ssid) {
            document.getElementById("ssid").value = ssid;
            document.getElementById("wifi-list").style.display = "none";
        }
    </script>
</body>
